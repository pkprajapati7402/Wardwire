name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Typecheck with mypy
        run: |
          mypy src/sentinel/core

      - name: Run Pytest
        run: |
          pytest tests/ -v --durations=10

      - name: Eval Harness Smoke Run
        run: |
          python -m sentinel.eval.harness --seed 42 --smoke --output reports/

